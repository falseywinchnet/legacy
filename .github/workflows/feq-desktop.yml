name: FEQ desktop packages
on:
  push:
    paths: ['FEQ/**', '.github/workflows/feq-desktop.yml']
  pull_request:
    paths: ['FEQ/**', '.github/workflows/feq-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt_arch: linux_gcc_64
          - os: macos-latest
            qt_arch: clang_64
          - os: windows-latest
            qt_arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          # Qt 6.11 split the Windows repository by toolchain.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@9e49c82edc6d946db376dec907cca5b4b486eec5'
          arch: ${{ matrix.qt_arch }}
          cache: true
          setup-python: false
      - uses: actions/cache@v4
        with:
          path: FEQ/build/qt-sources
          key: feq-qt-sources-6.11.2-v1
      - name: Prepare matching Qt source archives and license notices
        run: python FEQ/tools/prepare_qt_bundle.py --output FEQ/build/qt-licenses --cache FEQ/build/qt-sources
      - name: Configure
        run: cmake -S FEQ -B FEQ/build/desktop -DCMAKE_BUILD_TYPE=Release -DFEQ_BUILD_DESKTOP=ON -DFEQ_QT_LICENSE_DIR=${{ github.workspace }}/FEQ/build/qt-licenses
      - name: Build
        run: cmake --build FEQ/build/desktop --config Release --parallel 2
      - name: Verify numerical results and the desktop workflow
        run: ctest --test-dir FEQ/build/desktop -C Release --output-on-failure
      - name: Install application and dependencies
        run: cmake --install FEQ/build/desktop --config Release --prefix FEQ/build/desktop-package
      - name: Verify the relocated installed application
        if: runner.os != 'Linux'
        run: python FEQ/tests/check_installed_app.py --package FEQ/build/desktop-package --output FEQ/build/installation-verification
      - name: Verify the relocated installed application on X11
        if: runner.os == 'Linux'
        run: xvfb-run -a python FEQ/tests/check_installed_app.py --package FEQ/build/desktop-package --output FEQ/build/installation-verification
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Create installers
        run: cpack --config FEQ/build/desktop/CPackConfig.cmake -C Release -B FEQ/build/installers
      - name: Verify the actual installer
        if: runner.os != 'Linux'
        run: python FEQ/tests/check_installer.py --installers FEQ/build/installers --output FEQ/build/installer-verification
      - name: Install and verify the Debian package in clean Ubuntu
        if: runner.os == 'Linux'
        run: |
          mkdir -p FEQ/build/installer-verification
          docker run --rm -v "$PWD/FEQ:/work:ro" -v "$PWD/FEQ/build/installer-verification:/evidence" ubuntu:24.04 bash -c 'set -e; apt-get update -qq; DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /work/build/installers/*.deb python3 xvfb xauth fonts-dejavu-core; xvfb-run -a python3 /work/tests/check_installed_app.py --package /opt/feq-workbench --output /evidence; test -L /usr/share/applications/feq-workbench.desktop; apt-get remove -y -qq feq-workbench; test ! -e /usr/share/applications/feq-workbench.desktop'
      - uses: actions/upload-artifact@v4
        with:
          name: FEQ-Workbench-${{ runner.os }}-${{ runner.arch }}
          path: |
            FEQ/build/installers/*.dmg
            FEQ/build/installers/*.exe
            FEQ/build/installers/*.zip
            FEQ/build/installers/*.deb
            FEQ/build/installers/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FEQ-Desktop-verification-${{ runner.os }}-${{ runner.arch }}
          path: |
            FEQ/build/desktop/Testing/Temporary/LastTest.log
            FEQ/build/desktop/desktop-verification
            FEQ/build/desktop/example-verification
            FEQ/build/installation-verification
            FEQ/build/installer-verification
